name: "Chromatic"

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Run Chromatic
        id: chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: true

      - name: Publish Summary
        run: echo -e "| Results |  |\n| --- | --- |\n| Build Results | ${{steps.chromatic.outputs.buildUrl}} |\n| Storybook Preview | ${{steps.chromatic.outputs.storybookUrl}} |\n| Component Count | ${{steps.chromatic.outputs.componentCount}} |" >> $GITHUB_STEP_SUMMARY

      - name: Notify Discord
        if: success()
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_BODY="${{ github.event.pull_request.body }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"
          BRANCH_NAME="${{ github.head_ref }}"
          CHROMATIC_URL="${{ steps.chromatic.outputs.storybookUrl }}"
          curl -X POST -H "Content-Type: application/json" \
          -d "$(jq -n --arg content "✅ Chromatic 배포가 완료되었습니다!" \
                --arg title "Chromatic 배포 알림" \
                --arg description "브랜치: **${BRANCH_NAME}**\\nPR 제목: **${PR_TITLE}**\\nPR 내용: **${PR_BODY}**\\n작성자: **${PR_AUTHOR}**\\n[Chromatic 결과 확인하기](${CHROMATIC_URL})" \
                --argjson color 3066993 \
                '{
                  content: $content,
                  embeds: [
                    {
                      title: $title,
                      description: $description,
                      color: $color
                    }
                  ]
                }')" \
          ${{ secrets.DISCORD_DESIGN_WEBHOOK_URL }}
