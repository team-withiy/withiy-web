name: "CI"

on:
  push:
    branches:
      - develop

jobs:
  ci:
    name: Docker Build
    runs-on: ubuntu-latest
    environment: ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Export secrets to env/.env.development file
        uses: 0ndt/envfile@v2
        with:
          secrets: ${{ toJSON(secrets) }}
          file: env/.env.development

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          push: true
          build-args: |
            STAGE=dev
          tags: |
            ghcr.io/${{ secrets.GHCR_USER }}/withiy-web:latest,
            ghcr.io/${{ secrets.GHCR_USER }}/withiy-web:${{ github.sha }}
