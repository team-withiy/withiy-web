coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 2%
    patch:
      default:
        target: 80%
        threshold: 2%

ignore:
  - "**/*.test.{ts,tsx}"
  - "**/*.spec.{ts,tsx}"
  - "**/mocks/**"
  - "**/__mocks__/**"
  - "vitest.config.ts"
  - "vitest.setup.ts"
