coverage:
  status:
    project:
      default:
        target: 0%
    patch:
      default:
        target: 0%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true
  require_base: true
  require_head: true
  hide_project_coverage: false
  show_critical_files: true
  after_n_builds: 1

comment_management:
  delete_old: true
  maintain_last: true
  delay_before_delete: 60

ignore:
  # 테스트 파일
  - "**/*.test.{ts,tsx}"
  - "**/*.spec.{ts,tsx}"

  # 목업 데이터
  - "**/mocks/**"
  - "**/__mocks__/**"

  # 설정 파일
  - "vitest.config.ts"
  - "vitest.setup.ts"
  - "next.config.ts"
  - "**.config.{js,ts}"

  # Next.js 특정 파일
  - ".next/**"
  - "public/**"
  - "next-env.d.ts"

  # 타입 정의 파일
  - "**/*.d.ts"

  # 기타
  - "**/stories/**"
  - "**/*.stories.{ts,tsx}"
  - "**/*.stories.mdx"
  - "coverage/**"
  - "node_modules/**"
