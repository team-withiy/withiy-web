coverage:
  status:
    project:
      default:
        target: 0%
    patch:
      default:
        target: -%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true
  require_base: true
  require_head: true
  hide_project_coverage: false
  show_critical_files: true
  after_n_builds: 1

comment_management:
  delete_old: true
  maintain_last: true
  delay_before_delete: 60

ignore:
  - "**/*.test.{ts,tsx}"
  - "**/*.spec.{ts,tsx}"
  - "**/mocks/**"
  - "**/__mocks__/**"
  - "vitest.config.ts"
  - "vitest.setup.ts"
  - "public/**"
  - "next.config.ts"
